server {
    listen 35400 ssl;
    listen [::]:35400 ssl;
    server_name _;

    ssl_certificate /etc/nginx/ssl/notehub.crt;
    ssl_certificate_key /etc/nginx/ssl/notehub.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:NoteHubTLS:10m;
    ssl_session_timeout 1d;

    auth_basic "NoteHub";
    auth_basic_user_file /etc/nginx/.htpasswd-notehub;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-store" always;

    location / {
        proxy_pass http://127.0.0.1:43110;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
